apply plugin: 'com.android.application'

android {
    signingConfigs {
        capstone_sign_config {
            keyAlias 'capstone_key'
            keyPassword 'kwdrFHHi4HHnFz#vxJ2B7fVA!p*06iLK9p8YdJZv'
            storeFile file("$rootDir/keystore.jks")
            storePassword '1rkbvFuh%D173IvU%mG$DJSap!msp4WHLT5F*E%g'
        }
    }
    compileSdkVersion 28
    buildToolsVersion "29.0.0"
    defaultConfig {
        applicationId "com.atmko.onmywatch"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            buildConfigField "String", "apiKey", Api_Key

        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "apiKey", Api_Key
            signingConfig signingConfigs.capstone_sign_config
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    //android design support library
    implementation 'com.android.support:design:28.0.0'

    implementation "androidx.room:room-runtime:2.1.0"
    annotationProcessor "androidx.room:room-compiler:2.1.0"

    implementation "androidx.lifecycle:lifecycle-extensions:2.0.0"
    annotationProcessor "android.arch.lifecycle:compiler:1.1.1"

    //parceler
    implementation 'org.parceler:parceler-api:1.1.12'
    annotationProcessor 'org.parceler:parceler:1.1.12'

    //stack
    implementation project(':stack')

    //fast android networking
    implementation 'com.amitshekhar.android:android-networking:1.0.2'

    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'

    //preference fragment
    implementation "androidx.preference:preference:1.1.0-rc01"

    apply plugin: 'com.google.gms.google-services'  // Google Play services Gradle plugin

    //firebase analytics
    implementation 'com.google.firebase:firebase-analytics:17.1.0'
    //firebase ads
    implementation 'com.google.firebase:firebase-ads:18.2.0'


    // (WorkManager)
    implementation "androidx.work:work-runtime:2.2.0"

}
