apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

//for Crashlytics
apply plugin: 'io.fabric'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    signingConfigs {
        omw {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file("$rootDir/keystore.jks")
            storePassword keystoreProperties['storePassword']
        }
    }
    compileSdkVersion 29
    buildToolsVersion "29.0.3"
    defaultConfig {
        applicationId "com.atmko.onmywatch"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 19
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        buildConfigField "String", "tmdbApiKey", TMDB_Api_Key
        buildConfigField "String", "traktApiKey", Trakt_Api_Key
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.omw
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //multidex library
    implementation "androidx.multidex:multidex:2.0.1"

    //android design support library
    implementation 'com.google.android.material:material:1.1.0'

    implementation "androidx.room:room-runtime:2.2.5"
    annotationProcessor "androidx.room:room-compiler:2.2.5"

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    annotationProcessor "android.arch.lifecycle:compiler:1.1.1"

    //parceler
    implementation 'org.parceler:parceler-api:1.1.12'
    annotationProcessor 'org.parceler:parceler:1.1.12'

    //stack
    implementation project(':stack')

    //fast android networking
    implementation 'com.amitshekhar.android:android-networking:1.0.2'

    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'

    //preference fragment
    implementation "androidx.preference:preference:1.1.1"

    apply plugin: 'com.google.gms.google-services'  // Google Play services Gradle plugin

    //firebase analytics
    implementation 'com.google.firebase:firebase-analytics:17.4.0'
    //firebase Crashlytics
    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'

    //firestore
    implementation 'com.google.firebase:firebase-firestore:21.4.3'
    //firebase cloud functions
    implementation 'com.google.firebase:firebase-functions:19.0.2'

    //firebase authentication UI
    implementation 'com.firebaseui:firebase-ui-auth:4.3.1'

    //firebase storage
    implementation 'com.google.firebase:firebase-storage:19.1.1'

    //firebase authentication
    implementation 'com.google.firebase:firebase-auth:19.3.1'

    // (WorkManager)
    implementation "androidx.work:work-runtime:2.3.4"

    //billing
    implementation 'com.android.billingclient:billing:2.2.0'

    //rating library
    implementation 'com.github.hotchemi:android-rate:1.0.1'

    //temp google fix
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}

//test dependencies
dependencies {
    //espresso
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'com.android.support.test.espresso:espresso-contrib:3.0.2'
    implementation 'androidx.test.espresso:espresso-idling-resource:3.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'

    //junit
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    testImplementation 'junit:junit:4.12'

    // UiAutomator Testing
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'

    //testing work manager
    androidTestImplementation "androidx.work:work-testing:2.3.4"
}